name: Deploy (Manual Only)

# Automatic AWS deployment is disabled per project configuration.
# This workflow will never run automatically on git push or merge.
on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type 'DEPLOY' to explicitly confirm deployment to AWS"
        required: true
        default: ""

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ github.event.inputs.confirm_deployment == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy update to EC2
        run: |
          echo "[✓] Triggering zero-downtime container update on EC2 via AWS SSM..."
