[project]
name = "job-butler"
version = "0.1.0"
description = "Autonomous 24/7 job discovery, resume tailoring, and application platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
job-butler = "src.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
