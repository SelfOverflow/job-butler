<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply: Senior Software Engineer at Hooli</title></head>
<body>
  <h1>Senior Software Engineer</h1>
  <form id="application_form" action="/submit" method="post" enctype="multipart/form-data">
    <div class="field"><label for="first_name">First Name <span>*</span></label>
      <input type="text" id="first_name" name="job_application[first_name]" required></div>
    <div class="field"><label for="last_name">Last Name <span>*</span></label>
      <input type="text" id="last_name" name="job_application[last_name]" required></div>
    <div class="field"><label for="email">Email <span>*</span></label>
      <input type="email" id="email" name="job_application[email]" required></div>
    <div class="field"><label for="phone">Phone</label>
      <input type="tel" id="phone" name="job_application[phone]"></div>
    <div class="field"><label for="resume">Resume/CV <span>*</span></label>
      <input type="file" id="resume" name="job_application[resume]" required></div>
    <div class="field"><label for="cover_letter">Cover Letter</label>
      <input type="file" id="cover_letter" name="job_application[cover_letter]"></div>
    <div class="field"><label for="linkedin">LinkedIn Profile</label>
      <input type="url" id="linkedin" name="job_application[answers][0][text_value]"></div>
    <div class="field"><label for="authorized">Are you authorized to work in the US? <span>*</span></label>
      <select id="authorized" name="job_application[answers][1][boolean_value]" aria-required="true">
        <option value="">Select...</option><option value="1">Yes</option><option value="0">No</option>
      </select></div>
    <fieldset class="field">
      <legend>Do you require sponsorship? *</legend>
      <label><input type="radio" name="sponsorship" value="yes" required> Yes</label>
      <label><input type="radio" name="sponsorship" value="no"> No</label>
    </fieldset>
    <div class="field"><label for="why">Why do you want to work at Hooli? <span>*</span></label>
      <textarea id="why" name="job_application[answers][2][text_value]" required></textarea></div>
    <div class="field"><label for="gender">Gender</label>
      <select id="gender" name="job_application[gender]">
        <option value="">Decline to self-identify</option><option value="m">Male</option><option value="f">Female</option>
      </select></div>
    <div class="field"><label><input type="checkbox" id="privacy" name="privacy" required> I agree to the privacy policy</label></div>
    <input type="text" name="website_hp" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="authenticity_token" value="abc">
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
